<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">图 8　Mage-VL 的 codec-native 流式架构</title>
  <desc id="desc">每个到达的视频段先被压缩信号稀疏化，再进入滚动视觉窗口；因果 gate 决定何时主动输出。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="28" y="28" width="1544" height="844" rx="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="82" text-anchor="start" font-size="24" font-weight="800" fill="#2563eb">图 8</text>
  <text x="160" y="84" text-anchor="start" font-size="42" font-weight="800" fill="#172033">Mage-VL 的 codec-native 流式架构</text>
  <text x="70" y="122" text-anchor="start" font-size="22" font-weight="500" fill="#5d6678">每个到达的视频段先被压缩信号稀疏化，再进入滚动视觉窗口；因果 gate 决定何时主动输出。</text>
  <rect x="70" y="160" width="182" height="44" rx="22" fill="#dbeafe" stroke="#dbeafe" stroke-width="2"/><text x="161" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">流式输入</text>
  <rect x="70" y="230" width="210" height="112" rx="22" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="175" y="277" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">视频段到达</text><text x="175" y="316" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">chunk k</text>
  <line x1="280" y1="286" x2="330" y2="286" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="230" width="235" height="112" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="447.5" y="277" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Codec 解析</text><text x="447.5" y="316" text-anchor="middle" font-size="19" font-weight="500" fill="#5d6678">I 帧 + bitcost / MV</text>
  <line x1="565" y1="286" x2="615" y2="286" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="615" y="230" width="235" height="112" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="732.5" y="277" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">Patchify</text><text x="732.5" y="316" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">稀疏画布 + 坐标</text>
  <line x1="850" y1="286" x2="900" y2="286" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="900" y="230" width="235" height="112" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1017.5" y="277" text-anchor="middle" font-size="27" font-weight="700" fill="#172033">Mage-ViT</text><text x="1017.5" y="316" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">当前段视觉 tokens</text>
  <line x1="1135" y1="286" x2="1185" y2="286" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1185" y="210" width="342" height="152" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1356" y="277" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">滚动视觉窗口</text><text x="1356" y="316" text-anchor="middle" font-size="20" font-weight="500" fill="#5d6678">最近 N 段：k−N+1 … k</text>

  <path d="M 1356 362 L 1356 478" fill="none" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1094" y="478" width="433" height="134" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1310.5" y="536" text-anchor="middle" font-size="29" font-weight="700" fill="#172033">Mage-VL 多模态主干</text><text x="1310.5" y="575" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">问题 + 最近视觉窗口 + 历史文本</text>
  <line x1="1310" y1="612" x2="1310" y2="690" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1185" y="690" width="250" height="80" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1310" y="721" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">回答 / 动作</text><text x="1310" y="760" text-anchor="middle" font-size="18" font-weight="500" fill="#5d6678">按 gate 时机输出</text>

  <rect x="70" y="448" width="840" height="322" rx="26" fill="#fff" stroke="#475569" stroke-width="2"/>
  <rect x="100" y="474" width="226" height="44" rx="22" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="2"/><text x="213" y="504" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">因果主动 gate</text>
  <rect x="100" y="548" width="210" height="94" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="205" y="586" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">当前段摘要</text><text x="205" y="625" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">视觉变化</text>
  <rect x="362" y="548" width="210" height="94" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="467" y="586" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">Mamba state</text><text x="467" y="625" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">跨段因果记忆</text>
  <rect x="624" y="548" width="244" height="94" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="746" y="586" text-anchor="middle" font-size="23" font-weight="700" fill="#172033">输出概率</text><text x="746" y="625" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">wait / answer</text>
  <line x1="310" y1="595" x2="362" y2="595" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><line x1="572" y1="595" x2="624" y2="595" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 868 595 L 1010 595 L 1010 545 L 1094 545" fill="none" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="484" y="704" text-anchor="middle" font-size="23" font-weight="700" fill="#475569">state 随 chunk 更新，不读取未来段</text>
  <text x="1530" y="842" text-anchor="end" font-size="18" font-weight="600" fill="#94a3b8">Codec-Native Video · Technical Report</text>
</svg>