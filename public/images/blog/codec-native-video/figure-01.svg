  <rect x="1059" y="226" width="215" height="112" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1166.5" y="273" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">变换与量化</text><text x="1166.5" y="312" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">稀疏化系数</text>
  <rect x="1322" y="226" width="205" height="112" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1424.5" y="273" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">熵编码</text><text x="1424.5" y="312" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">码流 bitstream</text>
