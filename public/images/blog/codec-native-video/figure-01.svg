  <rect x="257" y="492" width="210" height="112" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="362" y="539" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">参考帧缓冲区</text><text x="362" y="578" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">供后续帧预测</text>
  <line x1="1118" y1="548" x2="1041" y2="548" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><line x1="831" y1="548" x2="754" y2="548" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/><line x1="544" y1="548" x2="467" y2="548" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 1425 338 L 1425 548 L 1328 548" fill="none" stroke="#059669" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 362 492 L 362 400 L 680 400 L 680 338" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="682" y="386" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">重建参考</text>
  <rect x="286" y="688" width="1028" height="92" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="800" y="723" text-anchor="middle" font-size="23" font-weight="650" fill="#172033">编码器必须在本地重建同一参考帧</text><text x="800" y="757" text-anchor="middle" font-size="23" font-weight="650" fill="#172033">否则后续运动补偿会与解码器逐帧漂移</text>
  <text x="1530" y="842" text-anchor="end" font-size="18" font-weight="600" fill="#94a3b8">Codec-Native Video · Technical Report</text>
