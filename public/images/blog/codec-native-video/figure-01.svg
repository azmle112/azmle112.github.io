  <rect x="1118" y="492" width="210" height="112" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="1223" y="539" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">反量化 / 反变换</text><text x="1223" y="578" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">局部重建残差</text>
