<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">图 1　混合视频编解码器的闭环</title>
  <desc id="desc">预测减少冗余，重建帧回到参考缓冲区，形成编码与解码共享的闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="28" y="28" width="1544" height="844" rx="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="82" text-anchor="start" font-size="24" font-weight="800" fill="#2563eb">图 1</text>
  <text x="160" y="84" text-anchor="start" font-size="42" font-weight="800" fill="#172033">混合视频编解码器的闭环</text>
  <text x="70" y="122" text-anchor="start" font-size="22" font-weight="500" fill="#5d6678">预测减少冗余，重建帧回到参考缓冲区，形成编码与解码共享的闭环。</text>
  <rect x="72" y="156" width="132" height="44" rx="22" fill="#dbeafe" stroke="#dbeafe" stroke-width="2"/><text x="138" y="186" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">编码端</text>
  <rect x="72" y="226" width="190" height="112" rx="22" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="167" y="273" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">原始画面</text><text x="167" y="312" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">当前帧 xₜ</text>
