<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">图 3　压缩码流信号栈</title>
  <desc id="desc">码流同时携带容器级开销、运动信息、残差信号与局部编码成本，四者不能混作同一分数。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="28" y="28" width="1544" height="844" rx="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="82" text-anchor="start" font-size="24" font-weight="800" fill="#2563eb">图 3</text>
  <text x="160" y="84" text-anchor="start" font-size="42" font-weight="800" fill="#172033">压缩码流信号栈</text>
  <text x="70" y="122" text-anchor="start" font-size="22" font-weight="500" fill="#5d6678">码流同时携带容器级开销、运动信息、残差信号与局部编码成本，四者不能混作同一分数。</text>
  <rect x="78" y="166" width="300" height="138" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="228" y="226" text-anchor="middle" font-size="31" font-weight="700" fill="#172033">容器包大小</text><text x="228" y="265" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">packet / frame bytes</text>
  <rect x="420" y="166" width="1095" height="138" rx="22" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="460" y="210" text-anchor="start" font-size="22" font-weight="800" fill="#2563eb">最容易获得</text>
  <text x="460" y="252" text-anchor="start" font-size="25" font-weight="550" fill="#172033">包含头部、熵编码结果和其他开销，只能近似表示整帧编码难度。</text>

  <rect x="78" y="326" width="300" height="138" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="228" y="386" text-anchor="middle" font-size="31" font-weight="700" fill="#172033">运动矢量 MV</text><text x="228" y="425" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">方向与位移</text>
  <rect x="420" y="326" width="1095" height="138" rx="22" fill="#fff" stroke="#0891b2" stroke-width="2"/>
  <text x="460" y="370" text-anchor="start" font-size="22" font-weight="800" fill="#0891b2">结构信号</text>
  <text x="460" y="412" text-anchor="start" font-size="25" font-weight="550" fill="#172033">描述块从参考帧到当前帧的位移，不等于视觉内容本身，也不代表残差大小。</text>

  <rect x="78" y="486" width="300" height="138" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="228" y="546" text-anchor="middle" font-size="31" font-weight="700" fill="#172033">预测残差</text><text x="228" y="585" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">当前块 − 预测块</text>
  <rect x="420" y="486" width="1095" height="138" rx="22" fill="#fff" stroke="#ea580c" stroke-width="2"/>
  <text x="460" y="530" text-anchor="start" font-size="22" font-weight="800" fill="#ea580c">像素误差信号</text>
  <text x="460" y="572" text-anchor="start" font-size="25" font-weight="550" fill="#172033">反映预测失败的位置和强度；需要解码或专门导出，可能受量化与重建流程影响。</text>

  <rect x="78" y="646" width="300" height="138" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="228" y="706" text-anchor="middle" font-size="31" font-weight="700" fill="#172033">局部 bitcost</text><text x="228" y="745" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">CTU / 宏块 / tile</text>
  <rect x="420" y="646" width="1095" height="138" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="460" y="690" text-anchor="start" font-size="22" font-weight="800" fill="#7c3aed">选择器常用信号</text>
  <text x="460" y="732" text-anchor="start" font-size="25" font-weight="550" fill="#172033">更接近局部编码难度，但尺度取决于 codec、QP、preset 与导出实现。</text>
  <text x="1530" y="842" text-anchor="end" font-size="18" font-weight="600" fill="#94a3b8">Codec-Native Video · Technical Report</text>
</svg>