<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">图 4　OneVision-Encoder 的统一输入思想</title>
  <desc id="desc">不同视觉来源先被整理为带时间与空间坐标的 token，再共享编码器与输出接口。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="28" y="28" width="1544" height="844" rx="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="82" text-anchor="start" font-size="24" font-weight="800" fill="#2563eb">图 4</text>
  <text x="160" y="84" text-anchor="start" font-size="42" font-weight="800" fill="#172033">OneVision-Encoder 的统一输入思想</text>
  <text x="70" y="122" text-anchor="start" font-size="22" font-weight="500" fill="#5d6678">不同视觉来源先被整理为带时间与空间坐标的 token，再共享编码器与输出接口。</text>
  <rect x="76" y="166" width="188" height="44" rx="22" fill="#dbeafe" stroke="#dbeafe" stroke-width="2"/><text x="170" y="196" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">输入来源</text>
  <rect x="76" y="238" width="280" height="122" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="216" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">Codec 视频</text><text x="216" y="329" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">I 帧 + 稀疏 P patch</text>
  <rect x="76" y="402" width="280" height="122" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="216" y="454" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">普通视频</text><text x="216" y="493" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">chunk / 均匀抽帧</text>
