  <rect x="535" y="568" width="212" height="58" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="641" y="607" text-anchor="middle" font-size="21" font-weight="700" fill="#172033">有效位 / 组 ID</text>
