  <rect x="951" y="514" width="168" height="44" rx="22" fill="#fef9c3" stroke="#fef9c3" stroke-width="2"/><text x="1035" y="544" text-anchor="middle" font-size="20" font-weight="700" fill="#ca8a04">RoPE / Mask</text>
  <line x1="1170" y1="463" x2="1272" y2="463" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1272" y="342" width="250" height="242" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1397" y="454" text-anchor="middle" font-size="30" font-weight="700" fill="#172033">视觉特征</text><text x="1397" y="493" text-anchor="middle" font-size="23" font-weight="500" fill="#5d6678">交给多模态模型</text>
  <rect x="488" y="710" width="1034" height="70" rx="20" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1005" y="754" text-anchor="middle" font-size="23" font-weight="650" fill="#172033">统一的是接口与坐标语义；不同输入仍可保留各自的采样与分组策略。</text>
  <text x="1530" y="842" text-anchor="end" font-size="18" font-weight="600" fill="#94a3b8">Codec-Native Video · Technical Report</text>
