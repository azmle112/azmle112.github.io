<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">图 5　codec-video-prep 的真实调用链</title>
  <desc id="desc">单视频命令与数据集批处理最终汇合到同一套后端选择、patch 导出和元数据写入流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <rect x="28" y="28" width="1544" height="844" rx="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
  <text x="70" y="82" text-anchor="start" font-size="24" font-weight="800" fill="#2563eb">图 5</text>
  <text x="160" y="84" text-anchor="start" font-size="42" font-weight="800" fill="#172033">codec-video-prep 的真实调用链</text>
  <text x="70" y="122" text-anchor="start" font-size="22" font-weight="500" fill="#5d6678">单视频命令与数据集批处理最终汇合到同一套后端选择、patch 导出和元数据写入流程。</text>
  <rect x="72" y="160" width="188" height="44" rx="22" fill="#dbeafe" stroke="#dbeafe" stroke-width="2"/><text x="166" y="190" text-anchor="middle" font-size="20" font-weight="700" fill="#2563eb">单视频路径</text>
  <rect x="72" y="222" width="216" height="94" rx="22" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="180" y="260" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">输入视频</text><text x="180" y="299" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">mp4 / mkv</text>
  <line x1="288" y1="269" x2="338" y2="269" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="338" y="222" width="246" height="94" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="461" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">codec-video-prep</text><text x="461" y="299" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">CLI 参数解析</text>
  <line x1="584" y1="269" x2="634" y2="269" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="634" y="222" width="246" height="94" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="757" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">后端选择</text><text x="757" y="299" text-anchor="middle" font-size="18" font-weight="500" fill="#5d6678">HEVC / H.264 / VP9 / DCVC</text>
  <line x1="880" y1="269" x2="930" y2="269" stroke="#0891b2" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="930" y="222" width="246" height="94" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1053" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">patch 聚合</text><text x="1053" y="299" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">readiness / canvas</text>
  <line x1="1176" y1="269" x2="1226" y2="269" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1226" y="222" width="300" height="94" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1376" y="260" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">输出目录</text><text x="1376" y="299" text-anchor="middle" font-size="18" font-weight="500" fill="#5d6678">画布 + position + manifest</text>

  <rect x="72" y="410" width="220" height="44" rx="22" fill="#ede9fe" stroke="#ede9fe" stroke-width="2"/><text x="182" y="440" text-anchor="middle" font-size="20" font-weight="700" fill="#7c3aed">数据集批处理</text>
  <rect x="72" y="472" width="216" height="94" rx="22" fill="#fff" stroke="#7c3aed" stroke-width="2"/><text x="180" y="510" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">JSONL 清单</text><text x="180" y="549" text-anchor="middle" font-size="18" font-weight="500" fill="#5d6678">视频路径 + 样本 ID</text>
  <line x1="288" y1="519" x2="338" y2="519" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="338" y="472" width="246" height="94" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="461" y="510" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">分片与并行</text><text x="461" y="549" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">worker / resume</text>
  <line x1="584" y1="519" x2="634" y2="519" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="634" y="472" width="246" height="94" rx="22" fill="#cffafe" stroke="#0891b2" stroke-width="2"/><text x="757" y="510" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">逐样本调用</text><text x="757" y="549" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">共享 codec 后端</text>
  <path d="M 757 472 L 757 364 L 1053 364 L 1053 316" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  <rect x="930" y="472" width="246" height="94" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><text x="1053" y="510" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">一致性校验</text><text x="1053" y="549" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">缺失 / 失败 / 重试</text>
  <line x1="1176" y1="519" x2="1226" y2="519" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1226" y="472" width="300" height="94" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1376" y="510" text-anchor="middle" font-size="25" font-weight="700" fill="#172033">数据集索引</text><text x="1376" y="549" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">可复现输入资产</text>

  <rect x="154" y="650" width="1292" height="118" rx="24" fill="#fff" stroke="#475569" stroke-width="2"/>
  <rect x="182" y="687" width="194" height="44" rx="22" fill="#e2e8f0" stroke="#e2e8f0" stroke-width="2"/><text x="279" y="717" text-anchor="middle" font-size="20" font-weight="700" fill="#475569">共同约束</text>
  <text x="410" y="716" text-anchor="start" font-size="25" font-weight="650" fill="#172033">必须记录实际 backend、codec 参数、分组规则、画布顺序和失败回退。</text>
  <text x="1530" y="842" text-anchor="end" font-size="18" font-weight="600" fill="#94a3b8">Codec-Native Video · Technical Report</text>
</svg>