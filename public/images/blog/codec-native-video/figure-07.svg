  <rect x="188" y="706" width="166" height="44" rx="22" fill="#fee2e2" stroke="#fee2e2" stroke-width="2"/><text x="271" y="736" text-anchor="middle" font-size="20" font-weight="700" fill="#dc2626">审计结论</text>
  <text x="390" y="737" text-anchor="start" font-size="24" font-weight="650" fill="#172033">论文算法、公开预处理包与仓库 main 的覆盖范围并不完全一致，部署时必须分层记录。</text>
