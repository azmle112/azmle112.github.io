  <rect x="1304" y="484" width="222" height="112" rx="22" fill="#d1fae5" stroke="#059669" stroke-width="2"/><text x="1415" y="531" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">LLM</text><text x="1415" y="570" text-anchor="middle" font-size="21" font-weight="500" fill="#5d6678">多模态生成</text>

