<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">从 1536 维像素块到 4096 维语言特征</title><desc id="desc">单张 448×448 RGB 图片；图中省略 batch 维。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="590" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">从 1536 维像素块到 4096 维语言特征</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">单张 448×448 RGB 图片；图中省略 batch 维。</text><rect x="30" y="170" width="190" height="130" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="125.0" y="205" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">像素 tubelet</text><text x="125.0" y="235" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">[784, 1536]</text><text x="125.0" y="262" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">3 × 2 × 16 × 16</text><path d="M220,235 L243,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="245" y="170" width="190" height="130" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="340.0" y="205" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="600">Patch Embedding</text><text x="340.0" y="235" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">Conv3d</text><text x="340.0" y="262" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">[784, 1152]</text><path d="M435,235 L458,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="460" y="170" width="190" height="130" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="555.0" y="205" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="600">Vision Transformer</text><text x="555.0" y="235" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">27 blocks</text><text x="555.0" y="262" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">[784, 1152]</text><path d="M650,235 L673,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="675" y="170" width="190" height="130" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="770.0" y="205" font-size="20" fill="#233e3a" text-anchor="middle" font-weight="600">Spatial Merger</text><text x="770.0" y="235" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">四 patch 拼接</text><text x="770.0" y="262" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">[196, 4608]</text><path d="M865,235 L888,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="890" y="170" width="190" height="130" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="985.0" y="205" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">输出投影</text><text x="985.0" y="235" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">MLP</text><text x="985.0" y="262" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">[196, 4096]</text><rect x="55" y="350" width="445" height="105" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="277.5" y="385" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">可学习绝对位置</text><text x="277.5" y="415" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">48×48 位置表 → 双线性插值</text><text x="277.5" y="442" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">加到视觉 hidden states</text><rect x="585" y="350" width="445" height="105" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="807.5" y="385" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">二维视觉 RoPE</text><text x="807.5" y="415" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">H / W 坐标 → 每头 72 维旋转</text><text x="807.5" y="442" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">作用于每层注意力的 Q / K</text><text x="55" y="510" font-size="21" fill="#233e3a" text-anchor="start" font-weight="400">注意力在 merger 之前完成；合并后的 token 已含有同一注意力段的全局空间信息。</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>