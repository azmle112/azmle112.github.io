<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">35B-A3B 的路由专家与共享专家</title><desc id="desc">40 层混合主干；专家中间维度和共享专家中间维度均为 512。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="590" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">35B-A3B 的路由专家与共享专家</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">40 层混合主干；专家中间维度和共享专家中间维度均为 512。</text><rect x="50" y="210" width="190" height="100" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="145.0" y="245" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">输入 token</text><text x="145.0" y="275" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">x ∈ ℝ²⁰⁴⁸</text><path d="M240,242 L315,185" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="325" y="130" width="310" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="480.0" y="165" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">Router</text><text x="480.0" y="195" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">256 个概率 → top-8</text><text x="480.0" y="222" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">所选概率重新归一化</text><path d="M635,185 L710,185" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="720" y="130" width="320" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="880.0" y="165" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">路由专家</text><text x="880.0" y="195" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">8 个 SwiGLU 专家</text><text x="880.0" y="222" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">加权求和 Σ p̃ₑ Eₑ(x)</text><path d="M240,280 L315,363" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="325" y="315" width="310" height="110" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="480.0" y="350" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">独立共享专家</text><text x="480.0" y="380" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">每个 token 都经过</text><text x="480.0" y="407" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">sigmoid(wₛᵀx) 门控</text><path d="M635,370 L720,370" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="745" y="325" width="275" height="100" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="882.5" y="360" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">相加并返回</text><text x="882.5" y="390" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">输出仍为 2048 维</text><path d="M880,240 L880,325" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><text x="50" y="510" font-size="23" fill="#233e3a" text-anchor="start" font-weight="400">稀疏选择发生在 FFN 专家维度；不同 token 可以选择不同的 8 个专家。</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>