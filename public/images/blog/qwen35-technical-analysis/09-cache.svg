<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">混合缓存的固定部分与增长部分</title><desc id="desc">Qwen3.5-9B，batch = 1；下方横条只表示 Full Attention 的 KV cache。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="610" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">混合缓存的固定部分与增长部分</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5-9B，batch = 1；下方横条只表示 Full Attention 的 KV cache。</text><text x="65" y="132" font-size="24" fill="#233e3a" text-anchor="start" font-weight="600">普通生成的持久状态</text><rect x="55" y="155" width="450" height="120" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="280.0" y="190" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">24 层 Gated DeltaNet</text><text x="280.0" y="220" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">矩阵状态 · FP32 · 48 MiB</text><text x="280.0" y="247" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">卷积状态 · BF16 · 1.5 MiB</text><rect x="570" y="155" width="475" height="120" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="807.5" y="190" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">8 层 Full Attention</text><text x="807.5" y="220" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">K/V · BF16 · 每 token 32 KiB</text><text x="807.5" y="247" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">随序列长度 L 线性增长</text><text x="55" y="348" font-size="19" fill="#233e3a" text-anchor="start" font-weight="400">L = 8,192</text><rect x="260" y="324" width="20.0" height="29" rx="4" fill="#c0805e"/><text x="298.0" y="347" font-size="20" fill="#233e3a" text-anchor="start" font-weight="400">0.25 GiB</text><text x="55" y="396" font-size="19" fill="#233e3a" text-anchor="start" font-weight="400">L = 32,768</text><rect x="260" y="372" width="80" height="29" rx="4" fill="#c0805e"/><text x="358" y="395" font-size="20" fill="#233e3a" text-anchor="start" font-weight="400">1 GiB</text><text x="55" y="444" font-size="19" fill="#233e3a" text-anchor="start" font-weight="400">L = 131,072</text><rect x="260" y="420" width="320" height="29" rx="4" fill="#c0805e"/><text x="598" y="443" font-size="20" fill="#233e3a" text-anchor="start" font-weight="400">4 GiB</text><text x="55" y="492" font-size="19" fill="#233e3a" text-anchor="start" font-weight="400">L = 262,144</text><rect x="260" y="468" width="640" height="29" rx="4" fill="#c0805e"/><text x="918" y="491" font-size="20" fill="#233e3a" text-anchor="start" font-weight="400">8 GiB</text><text x="55" y="548" font-size="21" fill="#233e3a" text-anchor="start" font-weight="400">只统计缓存；不含权重、激活、workspace，也不含回滚所保存的额外历史。</text><text x="42" y="588" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>