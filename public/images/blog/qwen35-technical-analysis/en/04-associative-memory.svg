<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Key-value associations in a fixed matrix</title><desc id="desc">Start with additive linear memory; DeltaNet adds decay and error correction.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a" /></marker></defs><rect width="1100" height="590" fill="#fafbf7" /><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="49" font-size="27" fill="#233e3a" text-anchor="start" font-weight="650">Key-value associations in a fixed matrix</text><text x="42" y="83" font-size="17" fill="#61716a" text-anchor="start" font-weight="400">Start with additive linear memory; DeltaNet adds decay and error correction.</text><rect x="45" y="140" width="285" height="110" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="187.5" y="175" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Historical K/V</text><text x="187.5" y="205" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">(k₁, v₁), (k₂, v₂), …</text><text x="187.5" y="232" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Length grows with input</text><path d="M330,195 L400,195" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="410" y="140" width="300" height="110" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="560.0" y="175" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Accumulate a matrix</text><text x="560.0" y="205" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">S = Σ kⱼ vⱼᵀ</text><text x="560.0" y="232" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Shape: dₖ × dᵥ</text><path d="M710,195 L780,195" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="790" y="140" width="265" height="110" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="922.5" y="175" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Query readout</text><text x="922.5" y="205" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">o = Sᵀ q</text><text x="922.5" y="232" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Output: dᵥ features</text><text x="65" y="330" font-size="23" fill="#233e3a" text-anchor="start" font-weight="600">Read with unit key kᵢ</text><text x="65" y="387" font-size="30" fill="#233e3a" text-anchor="start" font-weight="400">Sᵀ kᵢ = vᵢ + Σⱼ≠ᵢ vⱼ (kⱼᵀ kᵢ)</text><rect x="65" y="430" width="450" height="95" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="290.0" y="465" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Target association</text><text x="290.0" y="495" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Ideally retrieves vᵢ</text><rect x="555" y="430" width="475" height="95" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="792.5" y="465" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Interference from other keys</text><text x="792.5" y="495" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Nonorthogonal keys compete</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>