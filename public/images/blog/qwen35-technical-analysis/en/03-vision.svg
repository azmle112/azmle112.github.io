<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">From 1536 pixel values to 4096 language features</title><desc id="desc">One 448×448 RGB image; the batch dimension is omitted.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a" /></marker></defs><rect width="1100" height="590" fill="#fafbf7" /><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="49" font-size="27" fill="#233e3a" text-anchor="start" font-weight="650">From 1536 pixel values to 4096 language features</text><text x="42" y="83" font-size="17" fill="#61716a" text-anchor="start" font-weight="400">One 448×448 RGB image; the batch dimension is omitted.</text><rect x="30" y="170" width="190" height="130" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="125.0" y="205" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Pixel tubelet</text><text x="125.0" y="235" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">[784, 1536]</text><text x="125.0" y="262" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">3 × 2 × 16 × 16</text><path d="M220,235 L243,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="245" y="170" width="190" height="130" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="340.0" y="205" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="600">Patch Embedding</text><text x="340.0" y="235" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Conv3d</text><text x="340.0" y="262" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">[784, 1152]</text><path d="M435,235 L458,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="460" y="170" width="190" height="130" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="555.0" y="205" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="600">Vision Transformer</text><text x="555.0" y="235" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">27 blocks</text><text x="555.0" y="262" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">[784, 1152]</text><path d="M650,235 L673,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="675" y="170" width="190" height="130" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="770.0" y="205" font-size="19" fill="#233e3a" text-anchor="middle" font-weight="600">Spatial Merger</text><text x="770.0" y="235" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Join four patches</text><text x="770.0" y="262" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">[196, 4608]</text><path d="M865,235 L888,235" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="890" y="170" width="190" height="130" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="985.0" y="205" font-size="19" fill="#233e3a" text-anchor="middle" font-weight="600">Output projection</text><text x="985.0" y="235" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">MLP</text><text x="985.0" y="262" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">[196, 4096]</text><rect x="55" y="350" width="445" height="105" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="277.5" y="385" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Learned absolute positions</text><text x="277.5" y="415" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">48×48 table → bilinear interpolation</text><text x="277.5" y="442" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Added to visual hidden states</text><rect x="585" y="350" width="445" height="105" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="807.5" y="385" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">2D visual RoPE</text><text x="807.5" y="415" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">H / W → rotate all 72 head dimensions</text><text x="807.5" y="442" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Applied to Q / K in each vision block</text><text x="55" y="510" font-size="20" fill="#233e3a" text-anchor="start" font-weight="400">Attention precedes merging; merged tokens already contain spatial context from their segment.</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>