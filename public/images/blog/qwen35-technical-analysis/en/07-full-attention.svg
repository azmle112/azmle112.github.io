<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">GQA and output gating in Full Attention</title><desc id="desc">The extra Q projection width supplies gates; the number of Q heads stays at 16.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a" /></marker></defs><rect width="1100" height="590" fill="#fafbf7" /><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="49" font-size="27" fill="#233e3a" text-anchor="start" font-weight="650">GQA and output gating in Full Attention</text><text x="42" y="83" font-size="17" fill="#61716a" text-anchor="start" font-weight="400">The extra Q projection width supplies gates; the number of Q heads stays at 16.</text><rect x="45" y="145" width="255" height="120" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="172.5" y="180" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Split Q projection</text><text x="172.5" y="210" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">16 Q heads × 256</text><text x="172.5" y="237" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">16 gates × 256</text><rect x="45" y="320" width="255" height="120" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="172.5" y="355" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">K / V projections</text><text x="172.5" y="385" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">4 heads each</text><text x="172.5" y="412" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">256 features per head</text><path d="M300,205 L375,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><path d="M300,375 L375,260" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="390" y="155" width="285" height="130" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="532.5" y="190" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">QK-Norm + MRoPE</text><text x="532.5" y="220" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Per-head Q/K RMSNorm</text><text x="532.5" y="247" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Rotate the first 64 features</text><path d="M675,220 L740,220" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="755" y="155" width="300" height="130" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="905.0" y="190" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Causal GQA</text><text x="905.0" y="220" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">16 Q heads share 4 K/V heads</text><text x="905.0" y="247" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">softmax(QKᵀ / √256 + M)</text><path d="M905,285 L905,345" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="700" y="345" width="355" height="105" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="877.5" y="380" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">Output gate → o_proj</text><text x="877.5" y="410" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">O ⊙ sigmoid(G) → 4096</text><text x="390" y="392" font-size="19" fill="#233e3a" text-anchor="start" font-weight="400">Gate bypasses attention</text><text x="45" y="515" font-size="22" fill="#233e3a" text-anchor="start" font-weight="400">The gate acts on each channel after attention and before o_proj.</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>