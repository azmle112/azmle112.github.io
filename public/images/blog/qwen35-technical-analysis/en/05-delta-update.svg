<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Five steps in a Gated DeltaNet update</title><desc id="desc">State shape: dₖ × dᵥ. The query q̃ is L2-normalized and scaled by 1/√dₖ.</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a" /></marker></defs><rect width="1100" height="590" fill="#fafbf7" /><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="49" font-size="27" fill="#233e3a" text-anchor="start" font-weight="650">Five steps in a Gated DeltaNet update</text><text x="42" y="83" font-size="17" fill="#61716a" text-anchor="start" font-weight="400">State shape: dₖ × dᵥ. The query q̃ is L2-normalized and scaled by 1/√dₖ.</text><rect x="30" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="125.0" y="185" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">① Decay</text><text x="125.0" y="215" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">S̄ₜ = αₜ Sₜ₋₁</text><path d="M220,205 L243,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="245" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="340.0" y="185" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">② Predict</text><text x="340.0" y="215" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">v̂ₜ = S̄ₜᵀ kₜ</text><path d="M435,205 L458,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="460" y="150" width="190" height="110" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="555.0" y="185" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">③ Correct</text><text x="555.0" y="215" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">δₜ = βₜ (vₜ − v̂ₜ)</text><path d="M650,205 L673,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="675" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="770.0" y="185" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">④ Write</text><text x="770.0" y="215" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Sₜ = S̄ₜ + kₜ δₜᵀ</text><path d="M865,205 L888,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)" /><rect x="890" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="985.0" y="185" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">⑤ Read</text><text x="985.0" y="215" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">oₜ = Sₜᵀ q̃ₜ</text><rect x="55" y="325" width="305" height="125" rx="12" fill="#e0e8f5" stroke="#becdc4" /><text x="207.5" y="360" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">α · Retain old state</text><text x="207.5" y="390" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">One scalar per head</text><text x="207.5" y="417" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Decay the previous state</text><rect x="397" y="325" width="305" height="125" rx="12" fill="#f6e2d3" stroke="#becdc4" /><text x="549.5" y="360" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">β · Set correction size</text><text x="549.5" y="390" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">One scalar per head</text><text x="549.5" y="417" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">Write along the current key</text><rect x="739" y="325" width="305" height="125" rx="12" fill="#dcebe4" stroke="#becdc4" /><text x="891.5" y="360" font-size="21" fill="#233e3a" text-anchor="middle" font-weight="600">z · Gate the output</text><text x="891.5" y="390" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">One value per output channel</text><text x="891.5" y="417" font-size="17" fill="#233e3a" text-anchor="middle" font-weight="400">RMSNorm(o) ⊙ SiLU(z)</text><text x="55" y="510" font-size="21" fill="#233e3a" text-anchor="start" font-weight="400">Forward updates memory S; decoding does not optimize projection weights or gate parameters.</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>