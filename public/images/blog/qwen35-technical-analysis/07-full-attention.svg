<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Full Attention 的 GQA 与输出门控</title><desc id="desc">额外的 Q 投影宽度用于 gate，Q 头数仍然是 16。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="590" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">Full Attention 的 GQA 与输出门控</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">额外的 Q 投影宽度用于 gate，Q 头数仍然是 16。</text><rect x="45" y="145" width="255" height="120" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="172.5" y="180" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">Q 投影拆分</text><text x="172.5" y="210" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">16 个 Q 头 × 256 维</text><text x="172.5" y="237" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">16 个 gate × 256 维</text><rect x="45" y="320" width="255" height="120" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="172.5" y="355" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">K / V 投影</text><text x="172.5" y="385" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">各 4 个 KV 头</text><text x="172.5" y="412" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">每头 256 维</text><path d="M300,205 L375,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M300,375 L375,260" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="390" y="155" width="285" height="130" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="532.5" y="190" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">QK-Norm + MRoPE</text><text x="532.5" y="220" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">Q/K 每头 RMSNorm</text><text x="532.5" y="247" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">前 64 维旋转</text><path d="M675,220 L740,220" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="755" y="155" width="300" height="130" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="905.0" y="190" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">GQA 因果注意力</text><text x="905.0" y="220" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">16 个 Q 头共享 4 组 K/V</text><text x="905.0" y="247" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">softmax(QKᵀ / √256 + M)</text><path d="M905,285 L905,345" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="700" y="345" width="355" height="105" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="877.5" y="380" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">输出门控 → o_proj</text><text x="877.5" y="410" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">O ⊙ sigmoid(G) → 4096 维</text><text x="390" y="392" font-size="20" fill="#233e3a" text-anchor="start" font-weight="400">gate 绕过注意力计算</text><text x="45" y="515" font-size="23" fill="#233e3a" text-anchor="start" font-weight="400">输出 gate 对每个通道生效，作用在注意力输出之后、o_proj 之前。</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>