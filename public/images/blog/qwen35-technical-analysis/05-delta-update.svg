<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">Gated DeltaNet 的五步状态更新</title><desc id="desc">状态采用 dₖ × dᵥ 方向；q̃ 已包含 L2 归一化和 1/√dₖ 缩放。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="590" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">Gated DeltaNet 的五步状态更新</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">状态采用 dₖ × dᵥ 方向；q̃ 已包含 L2 归一化和 1/√dₖ 缩放。</text><rect x="30" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="125.0" y="185" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">① 衰减</text><text x="125.0" y="215" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">S̄ₜ = αₜ Sₜ₋₁</text><path d="M220,205 L243,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="245" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="340.0" y="185" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">② 预测</text><text x="340.0" y="215" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">v̂ₜ = S̄ₜᵀ kₜ</text><path d="M435,205 L458,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="460" y="150" width="190" height="110" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="555.0" y="185" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">③ 误差</text><text x="555.0" y="215" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">δₜ = βₜ (vₜ − v̂ₜ)</text><path d="M650,205 L673,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="675" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="770.0" y="185" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">④ 写回</text><text x="770.0" y="215" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">Sₜ = S̄ₜ + kₜ δₜᵀ</text><path d="M865,205 L888,205" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="890" y="150" width="190" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="985.0" y="185" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">⑤ 读取</text><text x="985.0" y="215" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">oₜ = Sₜᵀ q̃ₜ</text><rect x="55" y="325" width="305" height="125" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="207.5" y="360" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">α · 保留多少历史</text><text x="207.5" y="390" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">每个头一个标量</text><text x="207.5" y="417" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">先衰减整个旧状态</text><rect x="397" y="325" width="305" height="125" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="549.5" y="360" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">β · 修正多少误差</text><text x="549.5" y="390" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">每个头一个标量</text><text x="549.5" y="417" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">沿当前 key 的方向写入</text><rect x="739" y="325" width="305" height="125" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="891.5" y="360" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">z · 放行哪些输出</text><text x="891.5" y="390" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">每个输出通道一个值</text><text x="891.5" y="417" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">RMSNorm(o) ⊙ SiLU(z)</text><text x="55" y="510" font-size="22" fill="#233e3a" text-anchor="start" font-weight="400">前向更新的是记忆状态 S；投影权重与门控参数不会在解码时被优化器改写。</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>