<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">一个视觉前端，两类 token mixer</title><desc id="desc">以 Qwen3.5-9B 为例；所有语言层保持 4096 维输入输出。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="590" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">一个视觉前端，两类 token mixer</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">以 Qwen3.5-9B 为例；所有语言层保持 4096 维输入输出。</text><rect x="45" y="120" width="245" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="167.5" y="155" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">视觉输入</text><text x="167.5" y="185" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">动态分辨率 · patchify</text><text x="167.5" y="212" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">Conv3d → ViT × 27</text><rect x="45" y="260" width="245" height="105" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="167.5" y="295" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">2×2 Spatial Merger</text><text x="167.5" y="325" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">784 → 196 tokens</text><text x="167.5" y="352" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">1152 → 4096 维</text><path d="M165,230 L165,260" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="380" y="120" width="280" height="100" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="520.0" y="155" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">文本输入</text><text x="520.0" y="185" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">token embedding · 4096 维</text><path d="M290,310 L380,310" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><path d="M520,220 L520,265" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="380" y="265" width="280" height="100" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="520.0" y="300" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">统一输入序列</text><text x="520.0" y="330" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">视觉特征替换占位符</text><path d="M660,310 L715,310" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="725" y="115" width="330" height="70" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="890.0" y="150" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">Gated DeltaNet + FFN</text><rect x="725" y="198" width="330" height="70" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="890.0" y="233" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">Gated DeltaNet + FFN</text><rect x="725" y="281" width="330" height="70" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="890.0" y="316" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">Gated DeltaNet + FFN</text><rect x="725" y="364" width="330" height="70" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="890.0" y="399" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">Full Attention + FFN</text><text x="890" y="477" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="400">4 层一组，共重复 8 次</text><text x="45" y="467" font-size="25" fill="#233e3a" text-anchor="start" font-weight="600">9B 语言主干共 32 层</text><text x="45" y="505" font-size="22" fill="#233e3a" text-anchor="start" font-weight="400">24 层矩阵状态递推  +  8 层显式历史注意力</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>