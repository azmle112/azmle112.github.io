<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img" aria-labelledby="title desc"><title id="title">固定矩阵如何保存 key-value 关联</title><desc id="desc">先用最基础的线性累加解释矩阵状态；DeltaNet 随后加入衰减与误差修正。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="590" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">固定矩阵如何保存 key-value 关联</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">先用最基础的线性累加解释矩阵状态；DeltaNet 随后加入衰减与误差修正。</text><rect x="45" y="140" width="285" height="110" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="187.5" y="175" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">历史 token 的 K/V</text><text x="187.5" y="205" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">(k₁, v₁), (k₂, v₂), …</text><text x="187.5" y="232" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">长度随输入增长</text><path d="M330,195 L400,195" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="410" y="140" width="300" height="110" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="560.0" y="175" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">累计为矩阵</text><text x="560.0" y="205" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">S = Σ kⱼ vⱼᵀ</text><text x="560.0" y="232" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">形状为 dₖ × dᵥ</text><path d="M710,195 L780,195" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="790" y="140" width="265" height="110" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="922.5" y="175" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">query 读取</text><text x="922.5" y="205" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">o = Sᵀ q</text><text x="922.5" y="232" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">输出 dᵥ 维向量</text><text x="65" y="330" font-size="25" fill="#233e3a" text-anchor="start" font-weight="600">用单位 key kᵢ 查询</text><text x="65" y="387" font-size="32" fill="#233e3a" text-anchor="start" font-weight="400">Sᵀ kᵢ = vᵢ + Σⱼ≠ᵢ vⱼ (kⱼᵀ kᵢ)</text><rect x="65" y="430" width="450" height="95" rx="12" fill="#dcebe4" stroke="#becdc4"/><text x="290.0" y="465" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">目标关联</text><text x="290.0" y="495" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">理想情况下取回 vᵢ</text><rect x="555" y="430" width="475" height="95" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="792.5" y="465" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">其他 key 的串扰</text><text x="792.5" y="495" font-size="18" fill="#233e3a" text-anchor="middle" font-weight="400">非正交 key 会竞争相近方向</text><text x="42" y="568" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>