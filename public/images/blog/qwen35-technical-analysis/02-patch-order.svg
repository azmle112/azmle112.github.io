ize="22" fill="#233e3a" text-anchor="middle" font-weight="600">视觉 token 0</text><rect x="455" y="215" width="280" height="65" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="595.0" y="250" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">2  3  6  7</text><path d="M735,248 L815,248" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="825" y="215" width="210" height="65" rx="12" fill="#f6e2d3" stroke="#becdc4"/><text x="930.0" y="250" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">视觉 token 1</text><rect x="455" y="298" width="280" height="65" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="595.0" y="333" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">8  9  12  13</text><path d="M735,331 L815,331" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="825" y="298" width="210" height="65" rx="12" fill="#e0e8f5" stroke="#becdc4"/><text x="930.0" y="333" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">视觉 token 2</text><rect x="455" y="381" width="280" height="65" rx="12" fill="#e9e1ef" stroke="#becdc4"/><text x="595.0" y="416" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">10  11  14  15</text><path d="M735,414 L815,414" fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#a)"/><rect x="825" y="381" width="210" height="65" rx="12" fill="#e9e1ef" stroke="#becdc4"/><text x="930.0" y="416" font-size="22" fill="#233e3a" text-anchor="middle" font-weight="600">视觉 token 3</text><text x="65" y="500" font-size="23" fill="#233e3a" text-anchor="start" font-weight="400">每个 2×2 块的四个 patch 必须连续排列，才能按四个一组拼接。</text><text x="65" y="538" font-size="21" fill="#233e3a" text-anchor="start" font-weight="400">448×448 图片  →  28×28 = 784 个 patch  →  14×14 = 196 个视觉 token</text><text x="42" y="578" font-size="14" fill="#61716a" text-anchor="start" font-weight="400">Qwen3.5  /  TECHNICAL NOTES</text></g></svg>