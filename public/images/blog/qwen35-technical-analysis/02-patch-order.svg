<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc"><title id="title">Patch 顺序决定空间合并的含义</title><desc id="desc">颜色标记相邻 2×2 空间块；右侧是 merger 之后的序列。</desc><defs><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#61716a"/></marker></defs><rect width="1100" height="600" fill="#fafbf7"/><g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="42" y="49" font-size="29" fill="#233e3a" text-anchor="start" font-weight="650">Patch 顺序决定空间合并的含义</text><text x="42" y="83" font-size="18" fill="#61716a" text-anchor="start" font-weight="400">颜色标记相邻 2×2 空间块；右侧是 merger 之后的序列。</text><rect x="65" y="150" width="60" height="60" rx="6" fill="#dcebe4"/><text x="95" y="189" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">0</text><rect x="133" y="150" width="60" height="60" rx="6" fill="#dcebe4"/><text x="163" y="189" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">1</text><rect x="201" y="150" width="60" height="60" rx="6" fill="#f6e2d3"/><text x="231" y="189" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">2</text><rect x="269" y="150" width="60" height="60" rx="6" fill="#f6e2d3"/><text x="299" y="189" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">3</text><rect x="65" y="218" width="60" height="60" rx="6" fill="#dcebe4"/><text x="95" y="257" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">4</text><rect x="133" y="218" width="60" height="60" rx="6" fill="#dcebe4"/><text x="163" y="257" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">5</text><rect x="201" y="218" width="60" height="60" rx="6" fill="#f6e2d3"/><text x="231" y="257" font-size="24" fill="#233e3a" text-anchor="middle" font-weight="400">6</text><rect x="269" y="218" width="60" height="60" rx="6" fill="#f6e2d3"/><text x="299" y="257" font-size="24" fill="#233e3a" t